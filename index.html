<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無料講座の申込</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="card">
    <img class="brand-logo" src="logo_color.svg" alt="BeEngineer">
    <div id="status">読み込み中...</div>

    <div id="apply-flow" style="display:none;">
      <h2>2027年度 春の無料講座</h2>
      <form id="apply-form">
        <section class="step" data-step="1" data-required="true">
          <p class="progress">1 / 5</p>
          <p class="question">4月からの新学年を選んでください。</p>
          <div id="grade-list"></div>
          <button type="button" class="next-btn" disabled>次へ進む</button>
        </section>

        <section class="step" data-step="2" data-required="true">
          <p class="progress">2 / 5</p>
          <p class="question">校舎を選んでください。</p>
          <div id="campus-list"></div>
          <button type="button" class="next-btn" disabled>次へ進む</button>
        </section>

        <section class="step" data-step="3" data-required="true">
          <p class="progress">3 / 5</p>
          <p class="question">受講する無料講座を選んでください。</p>
          <p class="hint">複数選択できます。</p>
          <div id="course-list"></div>
          <button type="button" class="next-btn" disabled>次へ進む</button>
        </section>

        <section class="step" data-step="4" data-required="true">
          <p class="progress">4 / 5</p>
          <p class="question">参加者氏名を入力してください。</p>
          <input type="text" id="participant" name="participant" maxlength="50" autocomplete="name" placeholder="例）山田 花子">
          <button type="button" class="next-btn" disabled>次へ進む</button>
        </section>

        <section class="step" data-step="5" data-required="true">
          <p class="progress">5 / 5</p>
          <p class="question">学校名を入力してください。</p>
          <input type="text" id="school" name="school" maxlength="80" autocomplete="organization" placeholder="例）〇〇中学校">
          <button type="button" class="next-btn" disabled>確認画面へ</button>
        </section>

        <section class="step" data-step="6">
          <p class="question">申込内容の確認</p>
          <p class="edit-hint">下の項目をタップすると、<br>その内容を修正できます。</p>
          <div id="confirm-list"></div>
          <button type="button" id="submit-btn">申込</button>
        </section>
      </form>
    </div>

    <div id="done-step" style="display:none;">
      <h2>申込完了</h2>
      <p id="done-thanks" class="done-text"></p>
      <p id="done-guide" class="notice-text"></p>
      <a id="campus-line-link" class="line-link">友だち追加する</a>
      <button type="button" id="restart-btn">他の校舎でも申し込む</button>
      <button type="button" id="back-btn">戻る</button>
    </div>
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
